[build]
  # Netlify's Edge Functions bundler (dùng cho proxy.ts) chưa tương thích với
  # output Turbopack của Next.js 16 - build bằng Webpack riêng cho Netlify.
  command = "npx next build --webpack"

[build.environment]
  NODE_VERSION = "22"

# Khai báo tường minh để đảm bảo Netlify luôn chạy Next.js Runtime (sinh
# Functions/Edge Functions cho các route server-rendered) kể cả khi build
# command tuỳ chỉnh khiến auto-detect framework không kích hoạt đúng.
[[plugins]]
  package = "@netlify/plugin-nextjs"
